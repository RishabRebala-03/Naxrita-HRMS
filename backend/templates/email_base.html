<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{ title|default("Leave Notification") }}</title>
  <style>
    body { margin: 0; padding: 0; background: #f4f7fb; color: #152238; font-family: Arial, Helvetica, sans-serif; }
    table { border-collapse: collapse; }
    .preheader { display: none; max-height: 0; overflow: hidden; opacity: 0; }
    .shell { width: 100%; background: #f4f7fb; padding: 28px 12px; }
    .card { max-width: 680px; margin: 0 auto; background: #ffffff; border: 1px solid #dfe7f1; border-radius: 8px; overflow: hidden; }
    .content { padding: 28px; }
    h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.25; color: #102a43; }
    p { margin: 0 0 16px; font-size: 15px; line-height: 1.55; color: #334e68; }
    .summary { width: 100%; margin: 18px 0; border: 1px solid #dfe7f1; border-radius: 8px; overflow: hidden; }
    .summary td { padding: 11px 14px; border-bottom: 1px solid #e8eef6; font-size: 14px; vertical-align: top; }
    .summary tr:last-child td { border-bottom: 0; }
    .label { width: 38%; color: #627d98; font-weight: 700; background: #f8fafd; }
    .value { color: #102a43; }
    .pill { display: inline-block; padding: 5px 10px; border-radius: 999px; background: #e8f5ef; color: #17613a; font-size: 12px; font-weight: 700; }
    .pill.warn { background: #fff4e5; color: #8a4b00; }
    .pill.danger { background: #fdecec; color: #a12626; }
    .actions { margin-top: 22px; }
    .button { display: inline-block; margin: 0 8px 10px 0; padding: 12px 16px; background: #0b6bcb; color: #ffffff !important; text-decoration: none; border-radius: 6px; font-weight: 700; font-size: 14px; }
    .button.secondary { background: #52606d; }
    .note { padding: 14px 16px; background: #f8fafd; border-left: 4px solid #0b6bcb; border-radius: 6px; }
    .footer { padding: 18px 28px; background: #f8fafd; color: #627d98; font-size: 12px; line-height: 1.45; }
    @media (max-width: 560px) {
      .content, .brand, .footer { padding-left: 18px; padding-right: 18px; }
      h1 { font-size: 21px; }
      .label, .value { display: block; width: auto; }
      .label { border-bottom: 0; padding-bottom: 4px; }
      .value { padding-top: 0; }
      .button { display: block; text-align: center; margin-right: 0; }
    }
    @media (prefers-color-scheme: dark) {
      body, .shell { background: #0f1720; color: #e6edf5; }
      .card { background: #17212b; border-color: #34495e; }
      .brand { background: #0b2743; }
      h1, .value { color: #eef5ff; }
      p { color: #c7d2df; }
      .summary { border-color: #34495e; }
      .summary td { border-color: #34495e; }
      .label, .footer, .note { background: #1f2d3a; color: #c7d2df; }
    }
  </style>
</head>
<body>
  <div class="preheader">{{ preheader|default("Leave notification") }}</div>
  <div class="shell">
    <div class="card">
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        This is an automated notification. Please use the HRMS leaves page for any action or follow-up.
      </div>
    </div>
  </div>
</body>
</html>
